<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Font set for rendering the book with LibreOffice on macOS.

  The book body font is Noto Sans SC; code uses Noto Sans Mono CJK SC. If fontconfig cannot
  see the macOS system fonts, LibreOffice silently substitutes Linux Libertine
  and Frank Ruhl Hofshi, which changes line heights and pagination (a 354-page
  book becomes ~261 pages). Pass this file explicitly:

    FONTCONFIG_FILE=tools/fonts.conf FONTCONFIG_PATH=tools \
      tools/render_pdf.sh build/xxx.docx build/xxx.pdf
-->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <dir>/usr/share/fonts</dir>
  <cachedir>/private/tmp/signal-book-font-cache</cachedir>
</fontconfig>
