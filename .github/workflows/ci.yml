name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Pinned on purpose: ubuntu-latest has already moved to 26.04, which no
    # longer offers Python 3.9 images. Pinning keeps the oldest supported
    # interpreter testable instead of letting the runner image break CI.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: signal-lab
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run all examples
        if: matrix.python-version == '3.12'
        run: python run_all.py
